name: build-tailwind
on:
  push:
    branches: [main, master]
    paths: ['index.html', 'tailwind.config.js', 'input.css']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tailwind.css
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i input.css -o tailwind.css --minify
      - name: Commit tailwind.css
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add tailwind.css
          git diff --cached --quiet || (git commit -m "build tailwind.css" && git push)
