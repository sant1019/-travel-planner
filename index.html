<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅程平台｜管理後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#176b5b;--soft:#e9f5f1;--danger:#b42318;--warn:#a15c00;--shadow:0 10px 30px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.title{font-size:24px;font-weight:850}.sub{color:var(--muted);font-size:13px;margin-top:4px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#fafafa;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin:3px 0 5px}input,select,textarea{width:100%;border:1px solid #d6dae0;border-radius:12px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:76px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--brand);color:#fff}.btn.secondary{background:#eef1f4;color:#334155}.btn.danger{background:#fff0ef;color:var(--danger);border:1px solid #ffd4d0}.btn.small{padding:8px 10px;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#eef2f7;color:#475569}.badge.good{background:#e9f7ef;color:#17603a}.badge.bad{background:#fff0ef;color:#a32117}.badge.guide{background:#eef4ff;color:#3156a6}.customer{border-top:1px solid var(--line);padding:14px 0}.customer:first-child{border-top:0}.customer-name{font-weight:850;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.license{background:#fafafa;border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}.notice{border-radius:13px;padding:11px 12px;background:#fff7e8;color:#7a4b00;font-size:13px}.ok{background:#ecf8f3;color:#17603a}.login{max-width:480px;margin:8vh auto}.tabs{display:flex;gap:7px;margin-bottom:14px}.tab{flex:1}.search{margin-bottom:10px}.section-title{font-size:17px;font-weight:850;margin-bottom:12px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 14px}.x{background:#eef1f4;border:0;border-radius:50%;width:36px;height:36px;font-size:20px}.help{font-size:12px;color:var(--muted);line-height:1.55}.empty{text-align:center;color:var(--muted);padding:28px 10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.title{font-size:21px}.wrap{padding-top:12px}.top{align-items:flex-start}}
</style></head>
<body><div class="wrap">
<section id="authView" class="login card">
  <div class="title">🛡️ 平台管理後台</div><div class="sub">這是你的管理頁，不是旅客使用的行程頁。</div>
  <div class="tabs" style="margin-top:18px"><button class="btn tab" id="signInTab" type="button">登入</button><button class="btn secondary tab" id="signUpTab" type="button">第一次建立管理帳號</button></div>
  <div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="你的 Email"></div><div><label>密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="至少 8 碼"></div></div>
  <button class="btn" id="authBtn" style="width:100%;margin-top:12px">登入管理後台</button>
  <div id="authMsg" class="notice hidden" style="margin-top:12px"></div>
  <div class="help" style="margin-top:12px">第一次使用：先建立 Supabase Auth 帳號，再執行 Step 10.3 管理者設定 SQL，把這個帳號加入平台管理者。管理權限由 Supabase 後端判斷，不靠隱藏按鈕。</div>
</section>

<section id="adminView" class="hidden">
 <div class="top"><div><div class="title">🛡️ 旅程平台管理後台</div><div class="sub" id="who"></div></div><button class="btn secondary small" id="logout">登出</button></div>
 <div id="adminDenied" class="card hidden"><div class="notice">⚠️ 這個帳號已登入，但尚未被設為「平台管理者」。請先執行 Step 10.3 管理者設定 SQL。</div><div class="help" id="uidText" style="margin-top:10px"></div></div>
 <div id="adminContent" class="hidden">
  <div class="stats"><div class="stat"><b id="sCustomers">0</b><span>客戶</span></div><div class="stat"><b id="sActive">0</b><span>有效授權</span></div><div class="stat"><b id="sExpiring">0</b><span>7天內到期</span></div><div class="stat"><b id="sBlocked">0</b><span>拒絕／停用</span></div></div>
  <div class="card" style="margin-top:14px"><div class="row between"><div class="section-title" style="margin:0">👤 客戶與授權</div><div class="toolbar"><button class="btn secondary small" id="refresh">重新整理</button><button class="btn small" id="addCustomer">＋新增客戶</button></div></div><input class="search" id="search" placeholder="搜尋客戶姓名、電話、Email、來源…" style="margin-top:12px"><div id="customerList"></div></div>
 </div>
</section>
</div>

<div id="customerModal" class="modal hidden"><div class="sheet"><div class="row between"><h2>👤 新增客戶</h2><button class="x" data-close="customerModal">×</button></div><div class="grid"><div><label>客戶名稱 *</label><input id="cName"></div><div><label>電話</label><input id="cPhone"></div><div><label>Email</label><input id="cEmail" type="email"></div><div><label>來源</label><input id="cSource" placeholder="IG／朋友介紹／導遊／回購…"></div></div><label style="margin-top:10px">內部備註（只有你看得到）</label><textarea id="cNote"></textarea><div class="row" style="margin-top:12px"><button class="btn" id="saveCustomer">建立客戶</button><button class="btn secondary" data-close="customerModal">取消</button></div></div></div>

<div id="licenseModal" class="modal hidden"><div class="sheet"><div class="row between"><h2>🎫 建立授權</h2><button class="x" data-close="licenseModal">×</button></div><div class="notice ok" id="licenseFor"></div><div class="grid" style="margin-top:12px"><div><label>開始日期</label><input id="lStart" type="date"></div><div><label>到期日期</label><input id="lEnd" type="date"></div><div><label>系統成員上限</label><input id="lMembers" type="number" min="1" value="10"></div><div><label>可建立旅程數</label><input id="lTrips" type="number" min="1" value="1"></div><div><label>狀態</label><select id="lStatus"><option value="active">🟢 使用中</option><option value="pending">🕓 尚未啟用</option><option value="permanent">♾️ 永久授權</option><option value="paused">⏸️ 暫停</option></select></div><div><label>綁定 Room ID（可稍後）</label><input id="lRoom" placeholder="例如 Sant"></div></div><label style="margin-top:10px">管理備註</label><textarea id="lNote"></textarea><div class="row" style="margin-top:12px"><button class="btn" id="saveLicense">建立授權</button><button class="btn secondary" data-close="licenseModal">取消</button></div></div></div>

<script>
const SUPABASE_URL='https://gasrxuamehwtkhyurdas.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_q5DrYXs0g4baNMBTiKeEwA_zllswl4F';
let sb=null;
let authMode='signin', customers=[], licenses=[], tags=[], activeCustomer=null;
const $=id=>document.getElementById(id); const show=(id,on=true)=>$(id).classList.toggle('hidden',!on);
function msg(t,good=false){$('authMsg').textContent=t;$('authMsg').className='notice '+(good?'ok':'');show('authMsg',true)}
$('signInTab').onclick=()=>setMode('signin'); $('signUpTab').onclick=()=>setMode('signup');
function ensureSupabase(){
  if(sb) return true;
  if(window.supabase && window.supabase.createClient){
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    return true;
  }
  msg('⚠️ Supabase 連線元件尚未載入。請確認網路正常，並用 Safari 開啟這個 HTML 後再試一次。');
  return false;
}
function setMode(m){authMode=m;$('authBtn').textContent=m==='signin'?'登入管理後台':'建立管理帳號';$('signInTab').className='btn '+(m==='signin'?'':'secondary')+' tab';$('signUpTab').className='btn '+(m==='signup'?'':'secondary')+' tab';show('authMsg',false)}
$('authBtn').onclick=async()=>{if(!ensureSupabase())return;const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8)return msg('請輸入 Email，密碼至少 8 碼。');$('authBtn').disabled=true;try{let r;if(authMode==='signup')r=await sb.auth.signUp({email,password});else r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(authMode==='signup'&&!r.data.session){msg('帳號已建立。Supabase 若要求 Email 驗證，請先到信箱完成驗證，再回來登入。',true)}else await enter(r.data.user||r.data.session?.user)}catch(e){msg('⚠️ '+e.message)}finally{$('authBtn').disabled=false}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function enter(user){show('authView',false);show('adminView',true);$('who').textContent=user?.email||'';$('uidText').textContent='你的 Auth UID：'+(user?.id||'');const {data,error}=await sb.rpc('is_platform_admin');if(error||!data){show('adminDenied',true);show('adminContent',false);return}show('adminDenied',false);show('adminContent',true);await loadAll()}
async function loadAll(){const [c,l,t]=await Promise.all([sb.from('customers').select('*').order('created_at',{ascending:false}),sb.from('licenses').select('*').order('created_at',{ascending:false}),sb.from('customer_tags').select('*')]);if(c.error)return alert(c.error.message);customers=c.data||[];licenses=l.data||[];tags=t.data||[];render()}
function statusText(s){return({active:'🟢 使用中',pending:'🕓 尚未啟用',paused:'⏸️ 暫停',expired:'⌛ 已到期',revoked:'⛔ 已撤銷',permanent:'♾️ 永久'})[s]||s}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const q=$('search').value.trim().toLowerCase();const list=customers.filter(c=>[c.display_name,c.phone,c.email,c.source].some(v=>(v||'').toLowerCase().includes(q)));$('sCustomers').textContent=customers.length;const now=Date.now(),week=now+7*864e5;$('sActive').textContent=licenses.filter(l=>['active','permanent'].includes(l.status)&&(!l.expires_at||new Date(l.expires_at)>now)).length;$('sExpiring').textContent=licenses.filter(l=>l.status==='active'&&l.expires_at&&new Date(l.expires_at)>now&&new Date(l.expires_at)<=week).length;$('sBlocked').textContent=customers.filter(c=>c.is_blocked).length+licenses.filter(l=>['paused','revoked'].includes(l.status)).length;$('customerList').innerHTML=list.length?list.map(c=>{const ls=licenses.filter(l=>l.customer_id===c.id);return `<div class="customer"><div class="row between"><div><div class="customer-name">${esc(c.display_name)} ${c.is_blocked?'<span class="badge bad">🚫 已標記</span>':''}</div><div class="meta">${esc(c.phone||'')}${c.email?'　'+esc(c.email):''}${c.source?'　來源：'+esc(c.source):''}</div></div><button class="btn small" onclick="openLicense('${c.id}')">＋授權</button></div>${c.internal_note?`<div class="meta">📝 ${esc(c.internal_note)}</div>`:''}${ls.length?ls.map(l=>`<div class="license"><div class="row between"><b>${statusText(l.status)}</b><span class="badge">👥 ${l.member_limit} 人｜🧳 ${l.trip_limit} 旅程</span></div><div class="meta">${l.starts_at?'開始 '+new Date(l.starts_at).toLocaleDateString('zh-TW'):''}${l.expires_at?'　到期 '+new Date(l.expires_at).toLocaleDateString('zh-TW'):'　無到期日'}</div></div>`).join(''):'<div class="meta">尚未建立授權</div>'}</div>`}).join(''):'<div class="empty">目前沒有符合的客戶</div>'}
$('search').oninput=render;$('refresh').onclick=loadAll;$('addCustomer').onclick=()=>show('customerModal',true);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>show(b.dataset.close,false));
$('saveCustomer').onclick=async()=>{const display_name=$('cName').value.trim();if(!display_name)return alert('請輸入客戶名稱');const payload={display_name,phone:$('cPhone').value.trim()||null,email:$('cEmail').value.trim()||null,source:$('cSource').value.trim()||null,internal_note:$('cNote').value.trim()||null};const {error}=await sb.from('customers').insert(payload);if(error)return alert(error.message);['cName','cPhone','cEmail','cSource','cNote'].forEach(x=>$(x).value='');show('customerModal',false);await loadAll()};
window.openLicense=id=>{activeCustomer=customers.find(c=>c.id===id);$('licenseFor').textContent='授權客戶：'+activeCustomer.display_name;const d=new Date(),e=new Date(Date.now()+10*864e5);$('lStart').value=d.toISOString().slice(0,10);$('lEnd').value=e.toISOString().slice(0,10);$('lMembers').value=10;$('lTrips').value=1;$('lStatus').value='active';$('lRoom').value='';$('lNote').value='';show('licenseModal',true)};
$('saveLicense').onclick=async()=>{if(!activeCustomer)return;const status=$('lStatus').value;const start=$('lStart').value,end=$('lEnd').value;const payload={customer_id:activeCustomer.id,status,starts_at:start?start+'T00:00:00+08:00':null,expires_at:status==='permanent'?null:(end?end+'T23:59:59+08:00':null),member_limit:Math.max(1,+$('lMembers').value||1),trip_limit:Math.max(1,+$('lTrips').value||1),admin_note:$('lNote').value.trim()||null};if(status!=='permanent'&&payload.starts_at&&payload.expires_at&&new Date(payload.expires_at)<=new Date(payload.starts_at))return alert('到期日期必須晚於開始日期');const {data,error}=await sb.from('licenses').insert(payload).select().single();if(error)return alert(error.message);const room=$('lRoom').value.trim();if(room){const link=await sb.from('trip_license_links').insert({room_id:room,license_id:data.id});if(link.error)return alert('授權已建立，但 Room 綁定失敗：'+link.error.message)}show('licenseModal',false);await loadAll()};
(async()=>{if(!ensureSupabase())return;const {data}=await sb.auth.getSession();if(data.session)enter(data.session.user)})();
</script></body></html>
