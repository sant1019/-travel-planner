<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理後台診斷</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;margin:0;padding:18px;color:#202124}.card{max-width:620px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0001}.step{padding:13px 14px;margin:10px 0;border-radius:12px;background:#f1f3f4;font-weight:700}.ok{background:#e8f5e9;color:#176b2c}.bad{background:#fff0f0;color:#a61b1b}.wait{background:#fff8e1;color:#7a5700}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:10px;margin:7px 0;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#202124;color:white;font-size:16px;font-weight:700;margin-top:10px}small{display:block;line-height:1.6;color:#666;margin-top:14px}</style></head><body><div class="card"><h2>🛡️ 第一次建立管理帳號</h2><div id="js" class="step bad">❌ JavaScript 尚未啟動</div><div id="cdn" class="step wait">⏳ 正在檢查 Supabase 元件…</div><div id="conn" class="step wait">⏳ 等待 Supabase 連線…</div><div id="form" style="display:none"><input id="email" type="email" placeholder="管理者 Email"><input id="password" type="password" placeholder="密碼（至少 8 碼）"><button id="create">建立第一個管理帳號</button><div id="msg" class="step" style="display:none"></div></div><small>如果第一行一直顯示「❌ JavaScript 尚未啟動」，代表你目前使用的檔案預覽器不執行網頁程式，並不是按鈕故障。</small></div><script>document.getElementById('js').textContent='✅ JavaScript 已啟動';document.getElementById('js').className='step ok';</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){const cdn=document.getElementById('cdn'),conn=document.getElementById('conn'),form=document.getElementById('form'),msg=document.getElementById('msg');function show(t,ok){msg.style.display='block';msg.textContent=t;msg.className='step '+(ok?'ok':'bad')}if(!(window.supabase&&window.supabase.createClient)){cdn.textContent='❌ Supabase 元件沒有載入';cdn.className='step bad';conn.textContent='❌ 無法進行連線';conn.className='step bad';return}cdn.textContent='✅ Supabase 元件已載入';cdn.className='step ok';try{const sb=window.supabase.createClient('https://gasrxuamehwtkhyurdas.supabase.co','sb_publishable_q5DrYXs0g4baNMBTiKeEwA_zllswl4F');conn.textContent='✅ Supabase 用戶端已建立';conn.className='step ok';form.style.display='block';document.getElementById('create').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<8){show('請輸入 Email，密碼至少 8 碼。',false);return}show('⏳ 正在建立帳號…',true);const r=await sb.auth.signUp({email,password});if(r.error){show('❌ '+r.error.message,false);return}show(r.data.session?'✅ 管理帳號已建立並登入。':'✅ 帳號已建立；若 Supabase 要求 Email 驗證，請先到信箱完成驗證。',true)}}catch(e){conn.textContent='❌ '+e.message;conn.className='step bad'}})();
</script></body></html>
